<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermo del bot</title>
<style>
html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
#schermo { position: absolute; inset: 0; }
#stato { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9ca3af;
  font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; pointer-events: none; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="schermo"></div>
<div id="stato">Accendo lo schermo…</div>
<script type="module">
import RFB from "./novnc/core/rfb.js";

// parametri nell'hash (#t=biglietto&c=1): non finiscono nei log del server
const p = new URLSearchParams(location.hash.slice(1));
const biglietto = p.get("t") || "";
const controllo = p.get("c") === "1";
const stato = document.getElementById("stato");
let rfb, tentativi = 0;

function collega() {
  const ws = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/schermo/ws?t=" + encodeURIComponent(biglietto);
  rfb = new RFB(document.getElementById("schermo"), ws, { shared: true });
  rfb.viewOnly = !controllo;
  rfb.scaleViewport = true;
  rfb.background = "#0b0f14";
  rfb.addEventListener("connect", () => { tentativi = 0; stato.textContent = ""; });
  rfb.addEventListener("disconnect", () => {
    stato.textContent = "Schermo scollegato, riprovo…";
    if (++tentativi <= 20) setTimeout(collega, 2000);
    else stato.textContent = "Schermo non raggiungibile. Chiudi e riapri il pannello.";
  });
}
collega();
</script>
</body>
</html>
